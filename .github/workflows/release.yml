name: Publish packages and release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and release notes
        run: |
          python3 scripts/release-metadata.py --notes > "$RUNNER_TEMP/release-notes.md"
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
      - name: Upload packages to Cloudsmith
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          options=()
          if [ "$CHANNEL" = dev ]; then options=(--component dev); fi
          for distribution in bookworm trixie; do
            for package in dist/*.deb; do
              cloudsmith push deb "freshost/pve-snapshot-api/debian/$distribution" "$package" "${options[@]}"
            done
            cloudsmith push deb "freshost/pve-snapshot-api/debian/$distribution" dist/*.dsc \
              --sources-file dist/*.orig.tar.gz --changes-file dist/*.debian.tar.xz "${options[@]}"
          done
      - name: Publish GitHub Release
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
